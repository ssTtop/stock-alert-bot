name: stock-alerts

on:
  schedule:
    # เช็กราคาทุก 15 นาที ช่วงตลาดสหรัฐฯ (จ.-ศ. 13:00–21:45 UTC ≈ 20:00–04:45 น. เวลาไทย)
    - cron: "*/15 13-21 * * 1-5"
    # จัดสเตจรายสัปดาห์ เช้าวันเสาร์ 07:30 น. เวลาไทย (หลังปิดตลาดวันศุกร์)
    - cron: "30 0 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "โหมดที่จะรัน"
        type: choice
        options: [test, price, stage]
        default: test

permissions:
  contents: write   # ใช้บันทึก state.json กลับเข้า repo

concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 0 * * 6' && 'stage' || 'price') }}
        run: python bot.py --mode "$MODE"

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update alert state [skip ci]" && git pull --rebase && git push)
