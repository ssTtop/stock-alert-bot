# ============================================================
#  Watchlist + เป้าราคา  (แก้ไฟล์นี้ไฟล์เดียวพอ)
# ============================================================

# ดัชนีที่ใช้คำนวณ Mansfield RS
#   "^GSPC" = S&P 500 (ตามแบบ Weinstein)  ·  "^IXIC" = Nasdaq Composite
benchmark = "^GSPC"

# หุ้นที่จะจัดสเตจทุกสัปดาห์ (ใช้ชื่อย่อแบบ Yahoo Finance)
watchlist = [
  "CBRS",
  # AI / hardware / tech
  "NVDA", "PLTR", "MU", "ORCL", "AVGO", "ASML", "NBIS",
  # fintech / space / อื่นๆ
  "CRCL", "HOOD", "RKLB", "SPCX", "IREN", "PL", "GOOGL", "AMZN",
]

# ------------------------------------------------------------
#  เป้าราคา — เพิ่มบล็อก [[alerts]] ได้เรื่อยๆ
#  ใส่ above, below หรือทั้งคู่ก็ได้ / note ใส่หรือไม่ใส่ก็ได้
# ------------------------------------------------------------
[[alerts]]
ticker = "CBRS"
above  = 105   # high ของวันประกาศงบ Q3 (13 พ.ย.) = แนวต้านแรกของฐาน
below  = 100    # low 52 สัปดาห์ — หลุดแปลว่าฐานยังไม่จบ
note   = "ดูแนวฐาน Stage 1"

# ตัวอย่าง (ลบ # ออกแล้วแก้ตัวเลขเพื่อใช้งาน)
# [[alerts]]
# ticker = "MU"
# above  = 150.00
# note   = "เบรกฐาน Stage 1"

# ------------------------------------------------------------
#  ค่าตั้งของตรรกะจัดสเตจ (ไม่ต้องแก้ก็ได้)
# ------------------------------------------------------------
[settings]
ma_weeks       = 30     # เส้น MA หลัก
slope_lookback = 4      # วัดความชัน MA เทียบ 4 สัปดาห์ก่อน
flat_pct       = 1.0    # ชันไม่เกิน ±1% ใน 4 สัปดาห์ = ถือว่า MA แบน
rs_weeks       = 52     # ฐาน Mansfield RS
rearm_pct      = 1.0    # ราคาต้องถอยออกจากเป้า 1% ก่อนจะเตือนซ้ำ
weekly_summary = true   # ส่งสรุปสเตจทุกตัวทุกเช้าวันเสาร์
